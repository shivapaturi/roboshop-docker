networks:
  default:
    driver: bridge
    name: roboshop
    #external = true #If i created netwokr already using docker network create roboshop

services:
  mongodb:
    image: shivapaturi01/mongodb:v1
    container_name: mongodb
  catalogue:
    image: shivapaturi01/catalogue:v1
    container_name: catalogue
    depends_on:
    - mongodb
  redis:
    image: redis:7.0
    container_name: redis
  user:
    image: shivapaturi01/user:v1
    container_name: user
    depends_on:
    - redis
    - mongodb
  cart:
    image: shivapaturi01/cart:v1
    container_name: cart
    depends_on:
    - catalogue
    - redis
  mysql:
    image: shivapaturi01/mysql:v1
    container_name: mysql
  shipping:
    image: shivapaturi01/shipping:v1
    container_name: shipping
    depends_on:
    - cart
    - mysql
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitm
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
  payment:
    image: shivapaturi01/payment:v1
    container_name: payment
    environment:
      CART_HOST: cart
      CART_PORT: 8080
      USER_HOST: user
      USER_PORT: 8080
      AMQP_HOST: rabbitmq
      AMQP_USER: roboshop
      AMQP_PASS: roboshop123
    depends_on:
    - cart
    - user
    - rabbitmq
  frontend:
    image: shivapaturi01/frontend:v1
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
    - shipping
    - payment

   

    