networks:
  default:
    driver: bridge
    name: roboshop
    #external = true #If i created netwokr already using docker network create roboshop

services:
  mongodb:
    image: shivapaturi01/mongodb:v1
    container_name: mongodb
  catalogue:
    image: shivapaturi01/catalogue:v1
    container_name: catalogue
    depends_on:
    - mongodb
  redis:
    image: redis:7.0
    container_name: redis
  user:
    image: shivapaturi01/user:v1
    container_name: user
    depends_on:
    - redis
    - mongodb
  cart:
    image: shivapaturi01/cart:v1
    container_name: cart
    depends_on:
    - catalogue
    - redis
  mysql:
    image: shivapaturi01/mysql:v1
    container_name: mysql
  shipping:
    image: shivapaturi01/shipping:v1
    container_name: shipping
    depends_on:
    - cart
    - mysql
   

    